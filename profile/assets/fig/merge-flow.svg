<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">How a change gets in</title><desc id="d">A branch is judged on my own machine: gates, a signed receipt, and only then a merge. Nothing merges on a green badge alone.</desc><defs><radialGradient id="glow" cx="22%" cy="-10%" r="85%"><stop offset="0" stop-color="#2d7ff9" stop-opacity="0.16"/><stop offset="0.55" stop-color="#2d7ff9" stop-opacity="0.03"/><stop offset="1" stop-color="#2d7ff9" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="92%" cy="8%" r="45%"><stop offset="0" stop-color="#00e599" stop-opacity="0.08"/><stop offset="1" stop-color="#00e599" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="1199.0" height="399.0" rx="22" fill="#08090c" stroke="#1c2536" stroke-width="1.0"/><rect x="0.5" y="0.5" width="1199.0" height="399.0" rx="22" fill="url(#glow)" stroke="none" stroke-width="1.0"/><text x="48.0" y="60.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#7db4ff" text-anchor="start" letter-spacing="1.5">HOW A CHANGE GETS IN</text><text x="48.0" y="100.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#f1f5f9" text-anchor="start" letter-spacing="-0.5">How a change gets in</text><rect x="48.0" y="160.0" width="196.0" height="150.0" rx="16.0" fill="#0e1219" stroke="#7db4ff" stroke-width="1.0"/><circle cx="74.0" cy="190.0" r="14" fill="#7db4ff" stroke="none" stroke-width="1.0"/><text x="74.0" y="195.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#08090c" text-anchor="middle">1</text><text x="66.0" y="226.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#7db4ff" text-anchor="start">A branch</text><text x="66.0" y="252.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">one change, its gate</text><text x="66.0" y="270.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">manifest</text><line x1="247.0" y1="235.0" x2="270.0" y2="235.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="273.0" y="160.0" width="196.0" height="150.0" rx="16.0" fill="#0e1219" stroke="#00e599" stroke-width="1.0"/><circle cx="299.0" cy="190.0" r="14" fill="#00e599" stroke="none" stroke-width="1.0"/><text x="299.0" y="195.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#08090c" text-anchor="middle">2</text><text x="291.0" y="226.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#00e599" text-anchor="start">The Spark judges</text><text x="291.0" y="252.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">exact commit, only the</text><text x="291.0" y="270.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">gates whose inputs</text><text x="291.0" y="288.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">changed</text><line x1="472.0" y1="235.0" x2="495.0" y2="235.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="498.0" y="160.0" width="196.0" height="150.0" rx="16.0" fill="#0e1219" stroke="#00e599" stroke-width="1.0"/><circle cx="524.0" cy="190.0" r="14" fill="#00e599" stroke="none" stroke-width="1.0"/><text x="524.0" y="195.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#08090c" text-anchor="middle">3</text><text x="516.0" y="226.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#00e599" text-anchor="start">A signed receipt</text><text x="516.0" y="252.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">verdicts, exit codes,</text><text x="516.0" y="270.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">logs, into aien-receipts</text><line x1="697.0" y1="235.0" x2="720.0" y2="235.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="723.0" y="160.0" width="196.0" height="150.0" rx="16.0" fill="#0e1219" stroke="#94a3b8" stroke-width="1.0"/><circle cx="749.0" cy="190.0" r="14" fill="#94a3b8" stroke="none" stroke-width="1.0"/><text x="749.0" y="195.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#08090c" text-anchor="middle">4</text><text x="741.0" y="226.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="start">The hosted check</text><text x="741.0" y="252.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">one job: confirm the</text><text x="741.0" y="270.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">bundle matches the</text><text x="741.0" y="288.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">commit</text><line x1="922.0" y1="235.0" x2="945.0" y2="235.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="948.0" y="160.0" width="196.0" height="150.0" rx="16.0" fill="#0e1219" stroke="#f59e0b" stroke-width="1.0"/><circle cx="974.0" cy="190.0" r="14" fill="#f59e0b" stroke="none" stroke-width="1.0"/><text x="974.0" y="195.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#08090c" text-anchor="middle">5</text><text x="966.0" y="226.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="start">ready-to-merge</text><text x="966.0" y="252.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">the pipeline merges when</text><text x="966.0" y="270.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">both agree</text><text x="48.0" y="356.0" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Nothing merges on a green badge alone. The design is ADR 0033 in aien-architecture-mv; the receipts are public in aien-receipts.</text></svg>
